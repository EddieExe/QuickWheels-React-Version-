specVersion: v1alpha1
endpoints:
  statusScheduler:
    platform: gcfv2
    region: us-central1
    timeoutSeconds: 540
    availableMemoryMb: 256
    entryPoint: statusScheduler
    scheduleTrigger:
      schedule: every 15 minutes
      timeZone: Asia/Kolkata
  processEmailQueue:
    platform: gcfv2
    region: us-central1
    timeoutSeconds: 60
    availableMemoryMb: 256
    entryPoint: processEmailQueue
    eventTrigger:
      eventType: google.cloud.firestore.document.v1.created
      eventFilters:
        database: (default)
        document: email_queue/{docId}
      retry: false
  retryEmailQueue:
    platform: gcfv2
    region: us-central1
    timeoutSeconds: 60
    availableMemoryMb: 256
    entryPoint: retryEmailQueue
    eventTrigger:
      eventType: google.cloud.firestore.document.v1.updated
      eventFilters:
        database: (default)
        document: email_queue/{docId}
      retry: false